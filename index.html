<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EE-Partner — Advisory Board Information Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Password gate -->
  <div id="password-gate" class="password-gate">
    <div class="password-gate__card">
      <img src="assets/logo.png" alt="EE-Partner" class="password-gate__logo" />
      <h2 class="password-gate__title">Advisory Board</h2>
      <p class="password-gate__subtitle">Enter the access code to continue</p>
      <div class="password-gate__field">
        <input id="password-input" type="password" class="password-gate__input" placeholder="Access code" autocomplete="off" />
        <button id="password-submit" class="password-gate__btn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p id="password-error" class="password-gate__error hidden">Incorrect access code</p>
    </div>
  </div>

  <!-- Left-side stepper (desktop) / Top progress bar (mobile) -->
  <nav id="stepper" class="stepper" aria-label="Slide navigation"></nav>

  <!-- Mobile progress bar -->
  <div id="mobile-progress" class="mobile-progress">
    <img src="assets/logo.png" alt="EE-Partner" class="mobile-progress__logo" />
    <div class="mobile-progress-bar"></div>
    <span class="mobile-progress-label"></span>
  </div>

  <!-- Main slide viewport -->
  <main id="slide-viewport" class="slide-viewport">
    <div id="slide-container" class="slide-container"></div>
  </main>

  <!-- Navigation controls -->
  <div id="nav-controls" class="nav-controls">
    <button id="btn-prev" class="nav-btn nav-btn--prev" aria-label="Previous slide">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Previous</span>
    </button>
    <div class="nav-indicator">
      <span id="nav-current">1</span> / <span id="nav-total">8</span>
    </div>
    <button id="btn-next" class="nav-btn nav-btn--next" aria-label="Next slide">
      <span>Next</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- NDA overlay (shown on gated slides when not confirmed) -->
  <div id="nda-overlay" class="nda-overlay hidden">
    <div class="nda-overlay__backdrop"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
